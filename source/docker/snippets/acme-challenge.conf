# ACME HTTP-01 challenge -> Rust API (which answers from the acme_challenges
# table). Included by EVERY rendered server block (control/render.rs) and by the :80
# default_server in nginx.conf, because nginx picks the server block by
# server_name BEFORE default_server — the challenge must resolve wherever the
# probe lands. `^~` beats the `location /` prefix and suppresses regex checks.
location ^~ /.well-known/acme-challenge/ {
    # 항상 공개. 이 location이 자체 allow를 선언하면 nginx access 규칙 상속이
    # 끊겨(replace-not-merge), 서버 레벨 IP whitelist(allow…; deny all;)가 여기엔
    # 적용되지 않는다 — Let's Encrypt 검증 프로브(임의 IP)가 막혀 발급 실패하는 것을 방지.
    allow all;
    proxy_pass http://nwui_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
}
