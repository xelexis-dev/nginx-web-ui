# fail2ban jail 예시 — nginx-web-ui (호스트의 fail2ban 에서 사용)
#
# 이 파일은 컨테이너 안에서 동작하지 않는다. 호스트에 fail2ban 을 두고, 컨테이너의
# 로그 디렉토리를 호스트로 마운트한 뒤 아래 경로를 실제 마운트 위치로 바꿔 쓴다.
#
#   docker run ... \
#     -v /srv/nginx-web-ui/log/nginx:/var/log/nginx \
#     -v /srv/nginx-web-ui/log/app:/var/log/nginx-web-ui \
#     ...
#
# ★ 가장 흔한 함정: Docker 로 publish 한 포트(80/443/8080)로 들어오는 트래픽은
#   DNAT 을 거친 뒤 FORWARD 로 흐른다. fail2ban 기본 action(iptables-multiport)은
#   INPUT 에 규칙을 넣으므로 **밴이 걸린 것처럼 보이지만 실제로는 막히지 않는다.**
#   반드시 DOCKER-USER 체인에 넣는 action 을 쓸 것 — 아래 chain 설정이 그 용도다.

[DEFAULT]
# 호스트 자신과 내부망은 절대 밴하지 않는다. 운영 단말 IP 를 여기 추가할 것.
ignoreip = 127.0.0.1/8 ::1
banaction = iptables-multiport
# publish 포트를 막으려면 DOCKER-USER 여야 한다(위 설명 참조).
chain = DOCKER-USER

# ── 1) 앱 로그인 브루트포스 ────────────────────────────────────────────────
# 앱이 직접 쓰는 로그. nginx access.log 로는 대체할 수 없다(filter 주석 참조).
[nginx-web-ui-auth]
enabled  = true
filter   = nginx-web-ui-auth
logpath  = /var/log/nginx-web-ui/auth.log
port     = http,https,8080
maxretry = 5
findtime = 10m
bantime  = 1h

# ── 2) 스캐너 / 봇 ────────────────────────────────────────────────────────
# 이쪽은 fail2ban 기본 filter 를 그대로 쓴다. nginx error.log 를 읽는다.
[nginx-botsearch]
enabled  = true
logpath  = /var/log/nginx/error.log
port     = http,https,8080
maxretry = 5
findtime = 10m
bantime  = 1h

# ── 참고 ──────────────────────────────────────────────────────────────────
# nginx-http-auth 는 nginx 자체 auth_basic 실패를 잡는 filter 라 이 앱의 로그인과
# 무관하다. 이 앱의 로그인은 위 nginx-web-ui-auth 가 담당한다.
#
# 앱 뒤에 Cloudflare 같은 엣지가 있다면 서버별 "엣지/프록시 뒤 배치(실 IP 복원)"
# 설정을 먼저 켜야 access.log 에 실제 방문자 IP 가 남는다. 그렇지 않으면 엣지의
# IP 를 밴하게 된다.
