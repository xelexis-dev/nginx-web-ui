# fail2ban filter — nginx-web-ui 로그인 실패
#
# 대상 파일: /var/log/nginx-web-ui/auth.log  (앱이 직접 쓴다)
# 한 줄 형식:
#   2026-08-09T14:05:00.123Z nginx-web-ui auth-failure ip=203.0.113.5 reason=bad_credentials
#
# reason 값: bad_credentials | account_disabled
#
# 왜 nginx access.log 가 아니라 이 파일인가:
#   로그인 성공과 실패가 둘 다 `POST /login -> 303` 이라 access.log 에서 구분되지
#   않는다(차이는 Location 헤더뿐인데 combined 포맷은 이를 기록하지 않는다).
#   그래서 앱이 별도 신호를 낸다.
#
# IP 를 못 구한 요청은 `ip=-` 로 기록되며 아래 정규식에 매칭되지 않는다 — 기록은
# 남기되 신뢰할 수 없는 값으로 밴하지 않기 위한 의도된 동작이다.

[Definition]

# `^.*` 는 fail2ban 이 타임스탬프를 떼어낸 뒤 남는 앞부분(밀리초·Z 등)을 흡수한다.
failregex = ^.*\bnginx-web-ui auth-failure ip=<HOST> reason=\S+\s*$

ignoreregex =

datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S

# 적용 전 반드시 실측할 것:
#   fail2ban-regex /var/log/nginx-web-ui/auth.log \
#     /etc/fail2ban/filter.d/nginx-web-ui-auth.conf
# "Lines: N lines, 0 ignored, N matched, 0 missed" 가 나와야 한다.
