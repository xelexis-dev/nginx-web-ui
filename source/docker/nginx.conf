user nginx;
worker_processes auto;
# A proxied connection holds two descriptors, and the container soft limit may be only 1024.
worker_rlimit_nofile 16384;

# nginx.org 공식 패키지는 stream·realip 을 **정적 내장**으로 빌드한다(`nginx -V` 로
# --with-stream / --with-http_realip_module 확인). Debian 의 nginx-full 을 쓰던 때
# 필요했던 `include /etc/nginx/modules-enabled/*.conf` 는 더 이상 필요 없다.

events { worker_connections 4096; }

http {
    # CPU-dependent defaults can be too small for the forwarded-protocol map.
    map_hash_bucket_size 128;
    # Fit a full 253-byte DNS name regardless of the CPU cache-line default.
    server_names_hash_bucket_size 512;
    # Standard upgrade handling for managed reverse proxies.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Inherited by every server; a managed vhost can still set its own value.
    server_tokens off;

    # "combined" plus the requested host, so the log viewer can show which domain
    # each request hit (combined alone cannot — every proxied vhost looks alike).
    # $host is the normalized name (request line or Host header, lowercased,
    # falling back to server_name). Appending it keeps the combined prefix intact,
    # so log lines written before this change still parse — they just have no host.
    log_format combined_host '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$host"';
    access_log /var/log/nginx/access.log combined_host;
    error_log /var/log/nginx/error.log;

    # Preserve HTTPS when a managed TLS vhost proxies to the management listener.
    # Forwarded protocol is accepted only from the local nginx hop; direct
    # published-port requests cannot choose their own trusted protocol header.
    map "$realip_remote_addr:$http_x_forwarded_proto" $nwui_external_scheme {
        default $scheme;
        "127.0.0.2:https" https;
        "127.0.0.2:http" http;
    }

    # Container healthchecks must not create access-log lines or request metrics.
    # Match the original TCP peer and exact URI so external probes stay logged.
    map "$realip_remote_addr $request_uri" $nwui_access_log {
        "127.0.0.1 /api/health" 0;
        default 1;
    }

    server {
        listen 8080;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        # 보호된 관리 화면 경로만 127.0.0.2에서 접속하고 실제 IP·HTTPS 헤더를 생성한다.
        # 다른 upstream·stream(127.0.0.1)과 외부 요청의 전달 헤더는 신뢰하지 않는다.
        set_real_ip_from 127.0.0.2;
        real_ip_header   X-Real-IP;
        access_log /var/log/nginx/access.log combined_host if=$nwui_access_log;

        # Live metrics source for the dashboard. Exact-match location so it is
        # served by nginx itself (not proxied to Node), and restricted to the
        # collector's dedicated loopback source; all proxy paths and external requests are denied.
        location = /nginx_status {
            stub_status;
            include /etc/nginx/conf.d/.nwui-generation;
            access_log off;
            allow 127.0.0.3;
            deny all;
        }

        # Rust owns API routes and SSE; Next serves the SSR interface.
        location ^~ /api/ {
            proxy_pass http://nwui_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $nwui_external_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_pass_header X-Accel-Buffering;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://nwui_web;
            # $http_host keeps the port so Next.js Server Actions' origin/host check passes,
            # and downstream (Auth.js, audit x-forwarded-for) see correct forwarded headers.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $nwui_external_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "";
        }
    }

    # ACME HTTP-01 catch-all: answers challenges for domains that do not (yet)
    # match any managed :80 server block. Everything else on :80 is 404 — this
    # image intentionally serves nothing by default.
    server {
        listen 80 default_server;
        server_name _;
        include /etc/nginx/snippets/acme-challenge.conf;
        location / { return 404; }
    }

    # HTTPS catch-all — the :80 block above has a counterpart here for the same
    # reason. Without an explicit default_server on 443, nginx promotes whichever
    # managed vhost it loaded first (conf.d holds server-<uuid>.conf, so the
    # winner is arbitrary) and an unconfigured domain gets served another
    # domain's site over HTTPS. 404 makes it match the :80 behaviour.
    #
    # A handshake has to complete before we can answer, and no CA will certify a
    # domain we do not serve, so this uses the self-signed placeholder that
    # secrets-init generates per deployment. Clients therefore see a certificate
    # warning first — unavoidable, and preferable to serving the wrong site.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /var/lib/nginx-web-ui/tls/default.crt;
        ssl_certificate_key /var/lib/nginx-web-ui/tls/default.key;
        return 404;
    }

    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}
